[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunt-ai"
version = "0.1.0"
description = "Multi-agent career copilot: parse, tailor, evaluate, and apply."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph==0.3.34",
    "langgraph-checkpoint>=2.1,<3",
    "langgraph-checkpoint-postgres>=2.0,<3",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "httpx>=0.27",
    "PyPDF2>=3.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
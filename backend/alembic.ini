# Alembic configuration for JobHunt AI.

[alembic]
# Path to the migration environment.
script_location = alembic

# Template used to generate migration files.
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for the migration revision timestamp.
# timezone =

# Max length of characters to apply to the "slug" field.
# truncate_slug_length = 40

# Output encoding used by revision files.
# output_encoding = utf-8

# The connection URL is overridden by env.py from the application settings,
# so the same pipeline works against SQLite and PostgreSQL.
sqlalchemy.url = sqlite+aiosqlite:///./data/jobhunt.db

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
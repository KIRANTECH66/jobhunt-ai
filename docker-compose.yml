version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jobhunt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobhunt}
      POSTGRES_DB: ${DB_NAME:-jobhunt}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-jobhunt}:${DB_PASSWORD:-jobhunt}@db:5432/${DB_NAME:-jobhunt}
      CHECKPOINT_DSN: postgresql://${DB_USER:-jobhunt}:${DB_PASSWORD:-jobhunt}@db:5432/${DB_NAME:-jobhunt}?options=search_path%3Dcheckpoint
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: